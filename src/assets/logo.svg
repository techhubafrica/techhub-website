<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="100%" height="100%">
  <defs>
    <!-- Sun flare gradient -->
    <radialGradient id="realSunGlow" cx="45" cy="55" r="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFEB3B"/>
      <stop offset="55%" stop-color="#FF9800" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#009B4D" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group 1: Typography + Router -->
  <g transform="translate(10, 24)">
    <!-- "TECH" in Vibrant Orange -->
    <text x="0" y="44" font-family="'Urbanist', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="46" fill="#E97818" letter-spacing="-0.5">TECH</text>

    <!-- "H" in Green -->
    <text x="126" y="58" font-family="'Urbanist', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="42" fill="#009B4D">H</text>

    <!-- Router Emblem (Replacing / Sitting inside 'U') -->
    <g transform="translate(160, 22)">
      <!-- Antennas -->
      <line x1="8" y1="18" x2="2" y2="4" stroke="#37474F" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="22" y1="18" x2="28" y2="4" stroke="#37474F" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Orange WiFi Signal Arcs on left antenna -->
      <path d="M -3 2 A 8 8 0 0 1 5 10" stroke="#E97818" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M -6 -1 A 12 12 0 0 1 8 13" stroke="#E97818" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Router Body Box -->
      <rect x="3" y="18" width="24" height="15" rx="3" fill="#455A64" stroke="#263238" stroke-width="1"/>
      <rect x="5" y="20" width="20" height="11" rx="2" fill="#37474F"/>
      
      <!-- Router Display & LED -->
      <circle cx="9" cy="25" r="1.5" fill="#00E676"/>
      <circle cx="14" cy="25" r="1.5" fill="#FFD600"/>
      
      <!-- Central Diamond Antenna Emblem -->
      <polygon points="20,22 23,25 20,28 17,25" fill="#E97818"/>
    </g>

    <!-- "B" in Green -->
    <text x="194" y="58" font-family="'Urbanist', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="42" fill="#009B4D">B</text>

    <!-- "AFRICA" in Clean Black Below -->
    <text x="118" y="86" font-family="'Urbanist', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#111111" letter-spacing="1">AFRICA</text>
  </g>

  <!-- Group 2: Africa Continent Map with Sunburst (Right Side) -->
  <g transform="translate(230, 14)">
    <!-- Africa Continent Outline Path -->
    <path d="M 35 12 
             C 48 10, 68 11, 82 17 
             C 94 23, 100 36, 95 50 
             C 92 58, 96 66, 91 76 
             C 85 88, 73 100, 62 112 
             C 55 119, 49 126, 45 126 
             C 41 126, 39 118, 37 110 
             C 34 100, 31 92, 27 82 
             C 21 72, 10 68, 6 56 
             C 2 44, 1 37, 10 28 
             C 17 21, 26 24, 30 20 
             C 33 16, 30 13, 35 12 Z" 
          fill="#009B4D"/>

    <!-- Madagascar Island -->
    <path d="M 88 80 C 91 78, 95 86, 91 96 C 89 102, 86 100, 88 80 Z" fill="#009B4D"/>

    <!-- West Africa Sun Glow & Rays (Ghana region) -->
    <circle cx="36" cy="56" r="22" fill="url(#realSunGlow)"/>
    <circle cx="36" cy="56" r="5" fill="#FFFFFF" filter="url(#glowEffect)"/>
    
    <!-- Sun Rays -->
    <g stroke="#FFF176" stroke-width="1.8" stroke-linecap="round" opacity="0.95">
      <line x1="36" y1="42" x2="36" y2="47"/>
      <line x1="36" y1="65" x2="36" y2="70"/>
      <line x1="22" y1="56" x2="27" y2="56"/>
      <line x1="45" y1="56" x2="50" y2="56"/>
      <line x1="26" y1="46" x2="30" y2="50"/>
      <line x1="42" y1="62" x2="46" y2="66"/>
      <line x1="26" y1="66" x2="30" y2="62"/>
      <line x1="42" y1="50" x2="46" y2="46"/>
    </g>
  </g>
</svg>
